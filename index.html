<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch light or dark mode">Dark mode</button>

  <main class="dashboard">

    <!-- Greeting: time, date, greeting, custom name -->
    <section class="card card-wide greeting">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
      <h1 id="greeting" class="greeting-text">Hello</h1>

      <div class="name-row">
        <input type="text" id="nameInput" placeholder="Your name" maxlength="30" aria-label="Your name">
        <button id="saveName" type="button" class="btn">Save name</button>
      </div>
    </section>

    <!-- Focus timer -->
    <section class="card">
      <h2>Focus Timer</h2>
      <div id="timerDisplay" class="timer">25:00</div>
      <div class="btn-row">
        <button id="startBtn" type="button" class="btn">Start</button>
        <button id="stopBtn" type="button" class="btn btn-light">Stop</button>
        <button id="resetBtn" type="button" class="btn btn-light">Reset</button>
      </div>
    </section>

    <!-- To-do list -->
    <section class="card">
      <h2>Tasks</h2>
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100" aria-label="New task">
        <button id="addTaskBtn" type="button" class="btn">Add</button>
      </div>
      <p id="taskMessage" class="message" role="alert"></p>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <!-- Quick links -->
    <section class="card">
      <h2>Quick Links</h2>
      <div class="add-row">
        <input type="text" id="linkName" placeholder="Link name" maxlength="20" aria-label="Link name">
        <input type="text" id="linkUrl" placeholder="URL" aria-label="Link URL">
        <button id="addLinkBtn" type="button" class="btn">Add Link</button>
      </div>
      <p id="linkMessage" class="message" role="alert"></p>
      <div id="linkList" class="link-list"></div>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
